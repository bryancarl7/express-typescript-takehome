<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container py-5" style="max-width: 720px;">
        <h2 class="mb-4">📚 Search</h2>

        <div class="app-card mb-4">
            <p style="color:rgba(255,255,255,0.5); font-size:0.9rem; margin-bottom:1.5rem;">Search millions of entries via the Open Library API. Results are saved per user so you can revisit your search history anytime.</p>
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input id="username" type="text" class="form-control" placeholder="Enter your username">
            </div>
            <div class="mb-3">
                <label class="form-label">Search Term</label>
                <input id="searchTerm" type="text" class="form-control" placeholder="e.g. NASA">
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <button id="searchBtn" class="btn btn-primary">Search</button>
                <button id="clearBtn" class="btn btn-secondary">Clear</button>
                <button id="listPreviousBtn" class="btn btn-outline-primary">List Previous</button>
            </div>
        </div>

        <div id="error" class="alert alert-danger d-none mb-3"></div>

        <div id="loader" class="d-none">
            <div class="spinner"></div>
        </div>

        <div id="results" class="d-none">
            <div class="sort-bar">
                <span>Sort by</span>
                <button id="sortByName" onclick="sortHistory('username')">Name</button>
                <button id="sortBySearchTerm" onclick="sortHistory('searchTerm')">Search Term</button>
                <button id="sortByCount" onclick="sortHistory('resultCount')">Count</button>
            </div>
            <div id="resultsContent"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
